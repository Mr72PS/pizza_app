# Pizza_App: eigener Stack mit einem Dienst. Das Image kommt fertig von ghcr.io, hier wird nie gebaut.
# Die Werte stehen in einer .env neben dieser Datei (Vorlage: .env.example) oder in den Stack-Variablen von Dockhand.
services:
  pizza_app:
    image: ghcr.io/mr72ps/pizza_app:latest
    container_name: pizza_app
    restart: unless-stopped
    ports:
      - "${PORT:-8093}:8093"
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_URL: ${BASE_URL}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: ${TZ:-Europe/Zurich}
      # Benutzer und Gruppe, denen die Dateien im Datenordner gehören sollen
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Links der Ordner auf dem Server, rechts immer /data. Auf der Synology am besten den vollen Pfad eintragen,
      # zum Beispiel /volume1/docker/pizza_app/data:/data
      - ./data:/data
