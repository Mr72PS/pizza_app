# Pizza_App: eigener Stack mit einem Dienst. Das Image kommt fertig von ghcr.io, hier wird nie gebaut.
# Die Werte stehen in einer .env neben dieser Datei (Vorlage: .env.example) oder in den Stack-Variablen von Dockhand.
services:
  pizza_app:
    image: ghcr.io/mr72ps/pizza_app:latest
    container_name: pizza_app
    restart: unless-stopped
    # Muss dem Besitzer des Ordners ./data entsprechen, sonst kann die App nicht schreiben
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8093}:8093"
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_URL: ${BASE_URL}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - ./data:/data
